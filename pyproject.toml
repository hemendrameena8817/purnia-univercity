[tool.poetry]
name = "pup-umis-backend"
version = "0.1.0"
description = "Purnea University UMIS Backend"
authors = ["Anuprash Gupta <anuprash.gupta@zucol.in>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
Django = "^5.1"
django-simple-history = "^3.11.0"
djangorestframework = "^3.16.1"
djangorestframework-simplejwt = "^5.5.1"
PyJWT = "^2.10.1"
pillow = "^12.1.0"
django-cors-headers = "4.9.0"
drf-yasg = "^1.21.14"
mysqlclient = "^2.2.6"
python-decouple = "^3.8"
django-allauth = "^65.14.0"
dj-rest-auth = "^7.0.2"
pandas = "^3.0.0"
openpyxl = "^3.1.5"
xlrd = "^2.0.1"
pycryptodome = "^3.23.0"
pymysql = "^1.1.2"
django-simple-captcha = "^0.6.3"
xhtml2pdf = "^0.2.17"
qrcode = {extras = ["pil"], version = "^8.2"}
lxml = "^6.0.2"
weasyprint = "^68.0"
gunicorn = "^25.0.2"
python-barcode = "^0.16.1"
django-storages = "^1.14.6"
boto3 = "^1.42.44"
django-import-export = "4.3.3"
olefile = "^0.47"
opencv-python-headless = "^4.13.0.92"
pyzbar = "^0.1.9"
google-genai = "^1.68.0"
